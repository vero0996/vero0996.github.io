
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Arcade</title>

<style>
:root {
  --bg: #211711;
  --panel: #35251b;
  --panel-hover: #493225;
  --ink: #f0e2ce;
  --muted: #b39a80;
  --rust: #c16b43;
  --line: #4c382b;
  --mono: "Courier New", monospace;
  --serif: Georgia, serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 22px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
}

main {
  max-width: 1100px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}

.brand {
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--rust);
}

.status {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .1em;
}

.status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #a3a786;
  margin-right: 8px;
}

.hero {
  padding: 30px 0 20px;
}

h1 {
  font: clamp(42px, 8vw, 78px)/.95 var(--serif);
  margin: 0;
  letter-spacing: -.05em;
}

h1 span { color: var(--rust); }

.subtitle {
  margin-top: 13px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .05em;
}

.section-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .12em;
  margin: 24px 0 10px;
}

.games {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.choice {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  min-height: 115px;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  font: inherit;
  transition: .18s ease;
}

.choice:hover {
  background: var(--panel-hover);
  border-color: var(--rust);
  transform: translateY(-3px);
}

.choice.active {
  background: var(--rust);
  border-color: var(--rust);
  color: #fff8ed;
}

.game-icon {
  font-size: 28px;
  margin-bottom: 15px;
}

.game-name {
  font-size: 11px;
  letter-spacing: .04em;
  font-weight: bold;
}

.game-number {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 9px;
  opacity: .65;
}

.screen-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 26px 0 10px;
}

.screen-heading h2 {
  font-size: 12px;
  font-weight: normal;
  letter-spacing: .1em;
  margin: 0;
}

#current-game {
  color: var(--rust);
  font-size: 10px;
  text-align: right;
}

.game-container {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
}

iframe {
  display: block;
  width: 100%;
  height: 660px;
  border: 0;
  background: var(--bg);
}

.bottom-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-top: 13px;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 700px) {
  body { padding: 14px; }

  .games {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .choice {
    min-height: 100px;
    padding: 11px;
  }

  iframe { height: 700px; }
}

@media (max-width: 420px) {
  .games { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .status { font-size: 9px; }
  .bottom-bar { flex-direction: column; }
}
</style>
</head>

<body>
<main>

  <header class="topbar">
    <div class="brand">✳ ARCADE CLUB</div>
    <div class="status">ALL SYSTEMS READY</div>
  </header>

  <section class="hero">
    <h1>TINY ARCADE<span>.</span></h1>
    <div class="subtitle">FIVE GAMES. ZERO PRODUCTIVITY.</div>
  </section>

  <div class="section-label">
    <span>SELECT YOUR GAME</span>
    <span>01 — 05</span>
  </div>

  <nav class="games" aria-label="Game selection">

    <button class="choice active" type="button"
      data-game="leaves.html" data-name="FALLING LEAVES">
      <span class="game-number">01</span>
      <span class="game-icon">🍂</span>
      <span class="game-name">FALLING LEAVES</span>
    </button>

    <button class="choice" type="button"
      data-game="2048.html" data-name="2048">
      <span class="game-number">02</span>
      <span class="game-icon">🔢</span>
      <span class="game-name">2048</span>
    </button>

    <button class="choice" type="button"
      data-game="tetris.html" data-name="TETRIS">
      <span class="game-number">03</span>
      <span class="game-icon">🧱</span>
      <span class="game-name">TETRIS</span>
    </button>

    <button class="choice" type="button"
      data-game="mahjong.html" data-name="MAHJONG">
      <span class="game-number">04</span>
      <span class="game-icon">🀄</span>
      <span class="game-name">MAHJONG</span>
    </button>

    <button class="choice" type="button"
      data-game="solitaire.html" data-name="SOLITAIRE">
      <span class="game-number">05</span>
      <span class="game-icon">🂡</span>
      <span class="game-name">SOLITAIRE</span>
    </button>

  </nav>

  <div class="screen-heading">
    <h2>NOW PLAYING</h2>
    <span id="current-game">FALLING LEAVES</span>
  </div>

  <section class="game-container">
    <iframe
      id="game-frame"
      src="./leaves.html"
      title="Arcade game"
      loading="eager">
    </iframe>
  </section>

  <footer class="bottom-bar">
    <span>INSERT COIN TO CONTINUE ♡</span>
    <span>CHOOSE · PLAY · REPEAT</span>
  </footer>

</main>

<script>
(() => {
  const frame = document.getElementById("game-frame");
  const buttons = document.querySelectorAll(".choice");
  const currentGame = document.getElementById("current-game");

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      const file = button.dataset.game;
      const name = button.dataset.name;

      if (!file || !name) return;

      buttons.forEach(item => {
        item.classList.toggle("active", item === button);
      });

      currentGame.textContent = name;

      const url = new URL("./" + file, window.location.href);
      if (frame.src !== url.href) {
        frame.src = url.href;
      }
    });
  });
})();
</script>

</body>
</html>
